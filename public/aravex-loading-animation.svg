<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 682" width="2048" height="682" role="img" aria-label="ARAVEX Tech Studio animated wordmark: Build Automate Launch">
  <title>ARAVEX Tech Studio — Brand Loading Animation</title>
  <desc>Transparent vector animation traced from the supplied official ARAVEX logo. A geometric emblem emerges with calibrated reticles before settling into the full wordmark.</desc>
  <defs>
    <radialGradient id="haloGradient"><stop offset="0" stop-color="#10B981" stop-opacity=".27"/><stop offset=".55" stop-color="#64768B" stop-opacity=".12"/><stop offset="1" stop-color="#64768B" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen"><stop offset="0" stop-color="#F7F7F5" stop-opacity="0"/><stop offset=".48" stop-color="#F7F7F5" stop-opacity=".0"/><stop offset=".52" stop-color="#F7F7F5" stop-opacity=".9"/><stop offset=".56" stop-color="#F7F7F5" stop-opacity=".0"/><stop offset="1" stop-color="#F7F7F5" stop-opacity="0"/></linearGradient>
    <clipPath id="logoClip">
      <path fill-rule="evenodd" d="M682,349 L564,182 L562,182 L519,239 L433,348 L433,349 L478,349 L524,288 L562,241 L609,308 L613,312 L616,318 L638,349Z M1264,317 L1264,349 L1400,349 L1400,317 L1392,317 L1391,316 L1387,317 L1382,316 L1266,316Z M1264,251 L1264,283 L1265,284 L1399,284 L1400,283 L1400,251 L1395,250 L1265,250Z M1427,185 L1494,270 L1428,349 L1472,349 L1514,299 L1520,305 L1554,349 L1597,349 L1542,275 L1472,185Z M1264,185 L1264,218 L1400,218 L1400,185Z M1048,185 L1139,349 L1189,268 L1243,185 L1199,185 L1170,229 L1158,250 L1141,276 L1117,234 L1096,194 L1090,185Z M966,181 L854,349 L848,339 L806,283 L809,281 L813,281 L824,277 L833,271 L841,262 L847,251 L850,240 L850,226 L847,215 L839,202 L829,193 L819,188 L806,185 L703,185 L703,216 L802,216 L812,220 L815,223 L818,229 L817,241 L812,247 L806,250 L704,250 L703,251 L703,349 L735,349 L735,285 L736,284 L766,284 L811,341 L816,349 L898,349 L966,247 L969,250 L1034,349 L1078,349Z" />
    </clipPath>
  </defs>
  <style>
:root { color-scheme: dark; }
svg { overflow: visible; }
#halo, #reticle, #blueprint, #calibration, #path-trace, #sweep { opacity: 0; }
#blueprint { transform-origin: 1024px 341px; animation: showGrid 2.5s ease-in-out infinite; }
#reticle { transform-origin: 1024px 341px; animation: showDial 2.5s ease-in-out infinite; }
#reticleInner { transform-origin: 1024px 341px; animation: slowTurn 2.5s linear infinite; }
#calibration { transform-origin: 1024px 341px; animation: showCal 2.5s ease-in-out infinite; }
#monogram { transform-box: view-box; transform-origin: 0 0; animation: markMove 2.5s cubic-bezier(.30,.02,.20,1) infinite; }
#path-trace { transform-box: view-box; transform-origin: 0 0; animation: markTraceMove 2.5s cubic-bezier(.30,.02,.20,1) infinite; }
#path-trace path { stroke-dasharray: 610; stroke-dashoffset:610; animation: lineDraw 2.5s cubic-bezier(.25,.1,.2,1) infinite; }
#logo-rest { animation: restReveal 2.5s cubic-bezier(.15,.7,.2,1) infinite; }
#studio { animation: subReveal 2.5s ease-out infinite; }
#slogan { animation: taglineReveal 2.5s ease-out infinite; }
#sweep { animation: sweepMove 2.5s ease-in-out infinite; }
#halo { animation: softHalo 2.5s ease-in-out infinite; }
@keyframes showGrid { 0%,4%,100% {opacity:0;transform:scale(.76)} 17%,34% {opacity:.17;transform:scale(1)} 60%,90% {opacity:.025;transform:scale(1.08)} 96% {opacity:0} }
@keyframes showDial { 0%,5%,100% {opacity:0;transform:scale(.7)} 14%,40% {opacity:.72;transform:scale(1)} 59%,89% {opacity:.20;transform:scale(1.04)} 97% {opacity:0} }
@keyframes slowTurn { 0% {transform:rotate(-75deg)} 80%,100% {transform:rotate(110deg)} }
@keyframes showCal { 0%,9%,100% {opacity:0} 22%,42% {opacity:.9} 67%,88% {opacity:.1} 96% {opacity:0} }
@keyframes markMove {
 0%,4% {transform:translate(324px,10px) scale(1.25);opacity:0}
 16%,36% {transform:translate(324px,10px) scale(1.25);opacity:1}
 54%,88% {transform:translate(0px,0px) scale(1);opacity:1}
 96%,100% {transform:translate(0px,0px) scale(1);opacity:0}
}
@keyframes markTraceMove {
 0%,4% {transform:translate(324px,10px) scale(1.25);opacity:0}
 11%,33% {transform:translate(324px,10px) scale(1.25);opacity:1}
 46%,100% {transform:translate(0px,0px) scale(1);opacity:0}
}
@keyframes lineDraw { 0%,7% {stroke-dashoffset:610} 31%,60%,100% {stroke-dashoffset:0} }
@keyframes restReveal { 0%,38% {opacity:0;transform:translateY(9px)} 59%,88% {opacity:1;transform:translateY(0)} 96%,100% {opacity:0} }
@keyframes subReveal { 0%,50% {opacity:0;transform:translateY(7px)} 69%,88% {opacity:1;transform:translateY(0)} 96%,100% {opacity:0} }
@keyframes taglineReveal { 0%,57% {opacity:0;transform:translateY(6px)} 73%,89% {opacity:1;transform:translateY(0)} 96%,100% {opacity:0} }
@keyframes softHalo { 0%,9%,100% {opacity:0;transform:scale(.72)} 28% {opacity:.30;transform:scale(1)} 48% {opacity:.10;transform:scale(1.12)} 60%,96% {opacity:0;transform:scale(1.15)} }
@keyframes sweepMove { 0%,69%,100% {opacity:0;transform:translateX(415px)} 72% {opacity:0;transform:translateX(415px)} 81% {opacity:.45;transform:translateX(980px)} 89% {opacity:0;transform:translateX(1510px)} }
@media (prefers-reduced-motion: reduce) {
  #blueprint,#reticle,#calibration,#path-trace,#halo,#sweep {display:none}
  #monogram,#logo-rest,#studio,#slogan {animation:none;opacity:1;transform:none}
}
</style>
